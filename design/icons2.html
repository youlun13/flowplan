<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4f5f7;font:14px -apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#1a1d24;padding:24px;width:1000px}
.row{display:flex;gap:20px}.card{flex:1;background:#fff;border:1px solid #e1e4ea;border-radius:16px;padding:16px;text-align:center}
.big img{width:120px;height:120px;border-radius:27px;box-shadow:0 2px 6px rgba(0,0,0,.14);border:1px solid #e6e8ec}
.small{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:12px}
.small img{border-radius:22%;box-shadow:0 1px 3px rgba(0,0,0,.18)}
h3{margin:10px 0 2px;font-size:15px}p{margin:0;color:#6a7281;font-size:12px}
.dark{background:#121418;color:#e8eaee;border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center}
.dark img{width:40px;height:40px;border-radius:22%}
.home{background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23184e77"/><stop offset="1" stop-color="%2352b69a"/></linearGradient></defs><rect width="200" height="200" fill="url(%23g)"/></svg>');border-radius:12px;padding:10px;margin-top:10px;display:flex;gap:14px;justify-content:center;align-items:center;color:#fff}
.home img{width:52px;height:52px;border-radius:22%}
</style></head><body><div class="row">
<div class="card"><div class="big"><img src="icon-d.svg"></div><h3>D 分流 FP</h3><p>F 的中橫延伸成 P，深淺兩綠</p><div class="small"><img src="icon-d.svg" width="60" height="60"><img src="icon-d.svg" width="40" height="40"><img src="icon-d.svg" width="29" height="29"></div><div class="home"><img src="icon-d.svg">主畫面</div><div class="dark"><img src="icon-d.svg">深色</div></div>
<div class="card"><div class="big"><img src="icon-e.svg"></div><h3>E 共脊 FP</h3><p>F、P 共用一根脊柱，P 碗像河道轉彎</p><div class="small"><img src="icon-e.svg" width="60" height="60"><img src="icon-e.svg" width="40" height="40"><img src="icon-e.svg" width="29" height="29"></div><div class="home"><img src="icon-e.svg">主畫面</div><div class="dark"><img src="icon-e.svg">深色</div></div>
<div class="card"><div class="big"><img src="icon-f.svg"></div><h3>F 一筆流</h3><p>深綠 F 接淺綠 P，尾端流出去漸淡</p><div class="small"><img src="icon-f.svg" width="60" height="60"><img src="icon-f.svg" width="40" height="40"><img src="icon-f.svg" width="29" height="29"></div><div class="home"><img src="icon-f.svg">主畫面</div><div class="dark"><img src="icon-f.svg">深色</div></div>
<div class="card"><div class="big"><img src="icon-g.svg"></div><h3>G 風流 FP</h3><p>F 的橫畫被吹開捲成 P，尾巴有動勢</p><div class="small"><img src="icon-g.svg" width="60" height="60"><img src="icon-g.svg" width="40" height="40"><img src="icon-g.svg" width="29" height="29"></div><div class="home"><img src="icon-g.svg">主畫面</div><div class="dark"><img src="icon-g.svg">深色</div></div>
</div></body></html>
