<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4f5f7;font:14px -apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#1a1d24;padding:24px;width:760px}
.row{display:flex;gap:28px}.card{flex:1;background:#fff;border:1px solid #e1e4ea;border-radius:16px;padding:18px;text-align:center}
.big img{width:128px;height:128px;border-radius:29px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.small{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:14px}
.small img{border-radius:22%;box-shadow:0 1px 3px rgba(0,0,0,.15)}
h3{margin:12px 0 4px;font-size:16px}p{margin:0;color:#6a7281;font-size:13px}
.dark{background:#121418;color:#e8eaee;border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;gap:10px;justify-content:center}
.dark img{width:40px;height:40px;border-radius:22%}
</style></head><body><div class="row">
<div class="card"><div class="big"><img src="icon-a.svg"></div><h3>A 分流</h3><p>路線繞過固定行程，仍到達終點</p><div class="small"><img src="icon-a.svg" width="60" height="60"><img src="icon-a.svg" width="40" height="40"><img src="icon-a.svg" width="29" height="29"></div><div class="dark"><img src="icon-a.svg"><span style="align-self:center">深色桌面</span></div></div>
<div class="card"><div class="big"><img src="icon-b.svg"></div><h3>B 現在線</h3><p>三段時程區塊與「現在」的標記</p><div class="small"><img src="icon-b.svg" width="60" height="60"><img src="icon-b.svg" width="40" height="40"><img src="icon-b.svg" width="29" height="29"></div><div class="dark"><img src="icon-b.svg"><span style="align-self:center">深色桌面</span></div></div>
<div class="card"><div class="big"><img src="icon-c.svg"></div><h3>C 節點 F</h3><p>用節點與連線拼出 F，終點亮起</p><div class="small"><img src="icon-c.svg" width="60" height="60"><img src="icon-c.svg" width="40" height="40"><img src="icon-c.svg" width="29" height="29"></div><div class="dark"><img src="icon-c.svg"><span style="align-self:center">深色桌面</span></div></div>
</div></body></html>
