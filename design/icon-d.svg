<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <!-- F：一筆連續的路徑，從左下流上去，再流向右邊 -->
  <path d="M17 50V15h22" fill="none" stroke="#0F6E56" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 31h14" fill="none" stroke="#0F6E56" stroke-width="5.5" stroke-linecap="round"/>
  <!-- P：從 F 的中橫延伸出去的一條流線，繞成 P 的肚子 -->
  <path d="M31 31c9 0 15-2.5 15-8s-6-8-15-8" fill="none" stroke="#3FB58F" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M31 31v19" fill="none" stroke="#3FB58F" stroke-width="5.5" stroke-linecap="round"/>
</svg>
